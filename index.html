<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Club House · Condominio Los Olivos de Maipú</title>
  
  <!-- Favicon Oficial Los Olivos -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b1f1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
    }

    /* Contenedor responsivo con imagen visible obligatoria */
    .app-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: auto;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      line-height: 0;
      overflow: hidden;
      background-color: #173b32;
    }

    .bg-canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Zonas táctiles invisibles con feedback de pulsación */
    .tap-btn {
      position: absolute;
      cursor: pointer;
      border-radius: 12px;
      transition: background-color 0.12s ease, transform 0.12s ease;
      line-height: normal;
    }

    .tap-btn:active {
      background-color: rgba(255, 255, 255, 0.28);
      transform: scale(0.96);
    }

    /* 1. MÓDULO HORIZONTAL (4 BOTONES) */
    .btn-horarios   { top: 41.5%; left: 6.8%; width: 20.8%; height: 16.0%; }
    .btn-salida     { top: 41.5%; left: 29.8%; width: 20.5%; height: 16.0%; }
    .btn-quincho-top{ top: 41.5%; left: 52.0%; width: 20.5%; height: 16.0%; }
    .btn-aseo       { top: 41.5%; left: 74.0%; width: 19.5%; height: 16.0%; }

    /* 2. CUADRÍCULA DE BOTONES CUADRADOS */
    /* Fila 1 */
    .btn-muros      { top: 62.8%; left: 6.8%; width: 27.2%; height: 13.6%; }
    .btn-quincho    { top: 62.8%; left: 36.5%; width: 26.8%; height: 13.6%; }
    .btn-inflables  { top: 62.8%; left: 65.5%; width: 27.5%; height: 13.6%; }

    /* Fila 2 */
    .btn-ubicacion  { top: 77.8%; left: 3.2%; width: 31.8%; height: 13.8%; border-radius: 16px; }
    .btn-aforo      { top: 77.8%; left: 36.5%; width: 26.8%; height: 13.8%; }
    .btn-mascotas   { top: 77.8%; left: 65.5%; width: 27.5%; height: 13.8%; }

    /* 3. MODAL DESPLEGABLE */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 20, 16, 0.82);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
      line-height: normal;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      border-top: 6px solid #4a6c42;
      transform: translateY(15px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: 6px;
      background: #ecf4ea;
      color: #38582d;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      color: #1e301c;
      margin-bottom: 12px;
      line-height: 1.25;
    }

    .modal-body {
      font-size: 14px;
      line-height: 1.5;
      color: #3e4a42;
      margin-bottom: 20px;
    }

    .modal-body ul {
      list-style: none;
      padding: 0;
    }

    .modal-body li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 8px;
    }

    .modal-body li::before {
      content: "✔";
      position: absolute;
      left: 0;
      color: #557d44;
      font-weight: bold;
    }

    .btn-close {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 11px;
      background: #31442d;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-close:active {
      background: #1e2c1c;
    }

    .btn-action-map {
      background: #b85434;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="app-wrapper">
    <!-- IMAGEN BASE REAL VISIBLE GARANTIZADA -->
    <img src="menu_4.jpg" alt="Club House Los Olivos" class="bg-canvas" onerror="this.onerror=null; this.src='menu_3.jpg';">

    <!-- BOTONES ZONA SUPERIOR HORIZONTAL -->
    <div class="tap-btn btn-horarios" onclick="showInfo('horarios')"></div>
    <div class="tap-btn btn-salida" onclick="showInfo('salida')"></div>
    <div class="tap-btn btn-quincho-top" onclick="showInfo('quincho')"></div>
    <div class="tap-btn btn-aseo" onclick="showInfo('aseo')"></div>

    <!-- BOTONES CUADRÍCULA INFERIOR -->
    <div class="tap-btn btn-muros" onclick="showInfo('muros')"></div>
    <div class="tap-btn btn-quincho" onclick="showInfo('quincho')"></div>
    <div class="tap-btn btn-inflables" onclick="showInfo('inflables')"></div>

    <div class="tap-btn btn-ubicacion" onclick="showInfo('ubicacion')"></div>
    <div class="tap-btn btn-aforo" onclick="showInfo('aforo')"></div>
    <div class="tap-btn btn-mascotas" onclick="showInfo('mascotas')"></div>

    <!-- MODAL POPUP -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
      <div class="modal-card">
        <div class="modal-badge" id="modalBadge">REGLAMENTO</div>
        <h2 class="modal-title" id="modalTitle">Título</h2>
        <div class="modal-body" id="modalBody">Contenido</div>
        <button type="button" class="btn-close" onclick="forceClose()">ENTENDIDO</button>
      </div>
    </div>
  </div>

  <script>
    const dataReglas = {
      horarios: {
        badge: "01 · HORARIOS Y RUIDO",
        title: "Horarios y Cierre",
        body: "<ul><li><strong>Domingo a Jueves:</strong> 12:00 a 22:00 hrs.</li><li><strong>Viernes y Sábado:</strong> 12:00 a 01:00 hrs.</li><li>Corte riguroso de música al horario estipulado.</li></ul>"
      },
      salida: {
        badge: "02 · RECEPCIÓN Y LLAVES",
        title: "Salida y Devolución",
        body: "<ul><li>Entrega al día siguiente hasta las <strong>10:00 AM como máximo</strong>.</li><li>Revisión de inventario con administración.</li></ul>"
      },
      quincho: {
        badge: "03 · QUINCHO Y PARRILLA",
        title: "Parrilla Segura",
        body: "<ul><li>Parrillas entregadas <strong>100% apagadas</strong> y sin brasas activas.</li><li>Mesón de granito libre de grasas y comida.</li></ul>"
      },
      aseo: {
        badge: "04 · ASEO Y RESIDUOS",
        title: "Limpieza General",
        body: "<ul><li>Baños y cocina entregados limpios y despejados.</li><li>Basura amarrada en bolsas resistentes dentro de los contenedores.</li></ul>"
      },
      muros: {
        badge: "05 · INFRAESTRUCTURA",
        title: "Cuidado de Muros y Techos",
        body: "<ul><li>Globos <strong>EXCLUSIVAMENTE</strong> en las maderas habilitadas.</li><li>Cero cinta doble contacto, clavos o pegamentos en muros, ventanas o techos.</li></ul>"
      },
      inflables: {
        badge: "06 · JUEGOS Y JARDÍN",
        title: "Juegos Inflables",
        body: "<ul><li>Sólo se permiten juegos inflables de <strong>tamaño mediano</strong>.</li><li><strong>PROHIBIDO</strong> instalarlos sobre el pasto o áreas verdes.</li></ul>"
      },
      aforo: {
        badge: "07 · CAPACIDAD",
        title: "Aforo y Estacionamientos",
        body: "<ul><li><strong>Aforo máximo:</strong> 50 personas (adultos y niños en total).</li><li><strong>Estacionamientos asignados:</strong> 5 vehículos para el evento.</li></ul>"
      },
      mascotas: {
        badge: "08 · CONVIVENCIA",
        title: "Mascotas y Comunidad",
        body: "<ul><li>Mascotas <strong>bienvenidas sin restricción</strong>.</li><li>Los espacios comunes son de todos, cuidémoslos con orgullo.</li></ul>"
      },
      ubicacion: {
        badge: "09 · UBICACIÓN Y ACCESO",
        title: "Condominio Los Olivos de Maipú",
        body: "<p style='margin-bottom:12px;'>Abre el mapa directo para compartir con tus invitados por WhatsApp o Waze:</p><button type='button' class='btn-close btn-action-map' onclick='openMap()'>📍 ABRIR EN GOOGLE MAPS</button>"
      }
    };

    function showInfo(key) {
      const item = dataReglas[key];
      if (!item) return;
      document.getElementById('modalBadge').innerText = item.badge;
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalBody').innerHTML = item.body;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal(e) {
      if (e.target.id === 'modalOverlay') forceClose();
    }

    function forceClose() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function openMap() {
      window.open('https://maps.google.com/?q=Condominio+Los+Olivos+Maipu', '_blank');
    }
  </script>
</body>
</html>
