<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Club House · Condominio Los Olivos de Maipú</title>
  
  <!-- Favicon Oficial Los Olivos -->
  <link rel="icon" type="image/png" href="favicon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #0b1f1a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    /* Contenedor responsivo móvil */
    .app-wrapper {
      position: relative;
      width: 100%;
      max-width: 480px;
      margin: auto;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.65);
      line-height: 0;
      overflow: hidden;
      background-color: #173b32;
    }

    .bg-canvas {
      width: 100%;
      height: auto;
      display: block;
    }

    /* BOTÓN DE LOCUCIÓN / VOZ EN OFF (SUPERIOR DERECHA) */
    .btn-audio-voice {
      position: absolute;
      top: 3.2%;
      right: 5.0%;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.5);
      border: 3px solid #5a8249;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 120;
      transition: transform 0.15s ease, background-color 0.15s ease;
      line-height: normal;
    }

    .btn-audio-voice:active {
      transform: scale(0.90);
      background-color: #eaf5e6;
    }

    .btn-audio-voice svg {
      width: 24px;
      height: 24px;
      fill: #27431e;
    }

    .btn-audio-voice.playing {
      animation: pulse-audio 1.1s infinite alternate;
      border-color: #b85434;
      background-color: #fff6f2;
    }

    @keyframes pulse-audio {
      0% { transform: scale(1); box-shadow: 0 0 6px rgba(184, 84, 52, 0.4); }
      100% { transform: scale(1.14); box-shadow: 0 0 20px rgba(184, 84, 52, 0.9); }
    }

    /* HUINCHA DE LECTURA BAJADA AL ESPACIO INTERMEDIO */
    .ticker-franja {
      position: absolute;
      top: 60.5%;
      left: 0;
      width: 100%;
      height: 3.8%;
      display: flex;
      align-items: center;
      overflow: hidden;
      white-space: nowrap;
      pointer-events: none;
      z-index: 35;
    }

    .ticker-contenido {
      display: inline-block;
      font-size: 15.5px;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.95), 0 0 8px rgba(10, 30, 20, 0.9);
      letter-spacing: 0.5px;
      padding-left: 100%;
      animation: ticker-pausado 48s linear infinite;
    }

    @keyframes ticker-pausado {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    /* HOJAS CAYENDO SUAVEMENTE */
    .leaf-particle {
      position: absolute;
      pointer-events: none;
      z-index: 25;
      opacity: 0.75;
      animation-name: fall-sway;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
    }

    @keyframes fall-sway {
      0% {
        top: -8%;
        transform: translateX(0) rotate(0deg);
        opacity: 0;
      }
      15% {
        opacity: 0.85;
      }
      50% {
        transform: translateX(25px) rotate(140deg);
      }
      85% {
        opacity: 0.8;
      }
      100% {
        top: 105%;
        transform: translateX(-20px) rotate(320deg);
        opacity: 0;
      }
    }

    /* ZONAS TÁCTILES INVISIBLES SOBRE EL LIENZO */
    .tap-btn {
      position: absolute;
      cursor: pointer;
      border-radius: 12px;
      transition: background-color 0.12s ease, transform 0.12s ease;
      line-height: normal;
      z-index: 45;
    }

    .tap-btn:active {
      background-color: rgba(255, 255, 255, 0.28);
      transform: scale(0.96);
    }

    /* 1. MÓDULO HORIZONTAL CENTRAL (4 BOTONES) */
    .btn-horarios   { top: 41.5%; left: 6.8%; width: 20.8%; height: 16.0%; }
    .btn-salida     { top: 41.5%; left: 29.8%; width: 20.5%; height: 16.0%; }
    .btn-quincho-top{ top: 41.5%; left: 52.0%; width: 20.5%; height: 16.0%; }
    .btn-aseo       { top: 41.5%; left: 74.0%; width: 19.5%; height: 16.0%; }

    /* 2. CUADRÍCULA DE BOTONES CUADRADOS INFERIORES */
    .btn-muros      { top: 62.8%; left: 6.8%; width: 27.2%; height: 13.6%; }
    .btn-quincho    { top: 62.8%; left: 36.5%; width: 26.8%; height: 13.6%; }
    .btn-inflables  { top: 62.8%; left: 65.5%; width: 27.5%; height: 13.6%; }

    .btn-ubicacion  { top: 77.8%; left: 3.2%; width: 31.8%; height: 13.8%; border-radius: 16px; }
    .btn-aforo      { top: 77.8%; left: 36.5%; width: 26.8%; height: 13.8%; }
    .btn-mascotas   { top: 77.8%; left: 65.5%; width: 27.5%; height: 13.8%; }

    /* 3. MODAL POPUP */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 20, 16, 0.82);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 150;
      line-height: normal;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.5);
      border-top: 6px solid #4a6c42;
      transform: translateY(15px);
      transition: transform 0.2s ease;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .modal-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      padding: 4px 10px;
      border-radius: 6px;
      background: #ecf4ea;
      color: #38582d;
      margin-bottom: 8px;
    }

    .modal-title {
      font-size: 19px;
      font-weight: 800;
      color: #1e301c;
      margin-bottom: 12px;
      line-height: 1.25;
    }

    .modal-body {
      font-size: 14px;
      line-height: 1.5;
      color: #3e4a42;
      margin-bottom: 20px;
    }

    .modal-body ul {
      list-style: none;
      padding: 0;
    }

    .modal-body li {
      position: relative;
      padding-left: 20px;
      margin-bottom: 8px;
    }

    .modal-body li::before {
      content: "✔";
      position: absolute;
      left: 0;
      color: #557d44;
      font-weight: bold;
    }

    .btn-close {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 11px;
      background: #31442d;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-close:active {
      background: #1e2c1c;
    }

    .btn-action-map {
      background: #b85434;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="app-wrapper" id="appWrapper">
    <!-- IMAGEN DE FONDO OFICIAL MENU.JPG -->
    <img src="menu.jpg" alt="Club House Los Olivos" class="bg-canvas">

    <!-- HUINCHA DE LECTURA BAJADA -->
    <div class="ticker-franja">
      <div class="ticker-contenido">
        🌿 Entrega del recinto al día siguiente hasta las 10:00 AM &nbsp;&nbsp;•&nbsp;&nbsp; Cocina y baños limpios &nbsp;&nbsp;•&nbsp;&nbsp; Basura en bolsas separadas &nbsp;&nbsp;•&nbsp;&nbsp; Parrillas 100% apagadas &nbsp;&nbsp;•&nbsp;&nbsp; Aforo máx: 50 personas &nbsp;&nbsp;•&nbsp;&nbsp; 5 estacionamientos &nbsp;&nbsp;•&nbsp;&nbsp; ¡Cuidemos este espacio que nos sirve a todos! 🌿
      </div>
    </div>

    <!-- BOTÓN DE LOCUCIÓN VISIBLE -->
    <button type="button" class="btn-audio-voice" id="btnAudio" onclick="toggleVoiceAudio()" title="Escuchar resumen hablado" aria-label="Escuchar resumen hablado">
      <svg viewBox="0 0 24 24">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </button>

    <audio id="audioTrack" src="audio.mp3" preload="none"></audio>

    <!-- BOTONES ZONA SUPERIOR HORIZONTAL -->
    <div class="tap-btn btn-horarios" onclick="showInfo('horarios')"></div>
    <div class="tap-btn btn-salida" onclick="showInfo('salida')"></div>
    <div class="tap-btn btn-quincho-top" onclick="showInfo('quincho')"></div>
    <div class="tap-btn btn-aseo" onclick="showInfo('aseo')"></div>

    <!-- BOTONES CUADRÍCULA INFERIOR -->
    <div class="tap-btn btn-muros" onclick="showInfo('muros')"></div>
    <div class="tap-btn btn-quincho" onclick="showInfo('quincho')"></div>
    <div class="tap-btn btn-inflables" onclick="showInfo('inflables')"></div>

    <!-- FOOTER FIJO UBICACIÓN -->
    <div class="tap-btn btn-ubicacion" onclick="showInfo('ubicacion')"></div>
    <div class="tap-btn btn-aforo" onclick="showInfo('aforo')"></div>
    <div class="tap-btn btn-mascotas" onclick="showInfo('mascotas')"></div>

    <!-- MODAL POPUP -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
      <div class="modal-card">
        <div class="modal-badge" id="modalBadge">REGLAMENTO</div>
        <h2 class="modal-title" id="modalTitle">Título</h2>
        <div class="modal-body" id="modalBody">Contenido</div>
        <button type="button" class="btn-close" onclick="forceClose()">ENTENDIDO</button>
      </div>
    </div>
  </div>

  <script>
    // GENERADOR DE HOJAS CAYENDO
    const wrapper = document.getElementById('appWrapper');
    const leafSVGs = [
      `<svg width="18" height="24" viewBox="0 0 20 28" fill="#588147"><path d="M10 0 C18 6, 20 18, 10 28 C0 18, 2 6, 10 0 Z"/></svg>`,
      `<svg width="14" height="20" viewBox="0 0 20 28" fill="#a47249"><path d="M10 0 C18 6, 20 18, 10 28 C0 18, 2 6, 10 0 Z"/></svg>`,
      `<svg width="16" height="22" viewBox="0 0 20 28" fill="#75995b"><path d="M10 0 C18 6, 20 18, 10 28 C0 18, 2 6, 10 0 Z"/></svg>`
    ];

    function createLeaf() {
      const leaf = document.createElement('div');
      leaf.className = 'leaf-particle';
      leaf.innerHTML = leafSVGs[Math.floor(Math.random() * leafSVGs.length)];
      
      const leftPos = Math.random() * 85 + 5;
      const duration = Math.random() * 7 + 8;
      const delay = Math.random() * 4;
      
      leaf.style.left = `${leftPos}%`;
      leaf.style.animationDuration = `${duration}s`;
      leaf.style.animationDelay = `${delay}s`;
      
      wrapper.appendChild(leaf);

      setTimeout(() => {
        leaf.remove();
      }, (duration + delay) * 1000);
    }

    setInterval(createLeaf, 2400);
    for (let i = 0; i < 4; i++) createLeaf();

    // DATOS DE LOS MODALES
    const dataReglas = {
      horarios: {
        badge: "01 · HORARIOS Y RUIDO",
        title: "Horarios y Cierre",
        body: "<ul><li><strong>Domingo a Jueves:</strong> 12:00 a 22:00 hrs.</li><li><strong>Viernes y Sábado:</strong> 12:00 a 01:00 hrs.</li><li>El evento finaliza estrictamente a la 1 de la madrugada con corte de música.</li></ul>"
      },
      salida: {
        badge: "02 · RECEPCIÓN Y LLAVES",
        title: "Salida y Devolución",
        body: "<ul><li>La fiesta termina a la 1:00 AM, pero tienen plazo de entrega hasta las <strong>10:00 AM del día siguiente</strong>.</li><li>Pueden ordenar temprano en la mañana para entregar a las 10:00 AM impecable.</li></ul>"
      },
      quincho: {
        badge: "03 · QUINCHO Y PARRILLA",
        title: "Parrilla Segura",
        body: "<ul><li>Parrillas entregadas <strong>100% apagadas</strong> y sin brasas activas ni cenizas calientes.</li><li>Mesones de granito limpios y sin restos de comida.</li></ul>"
      },
      aseo: {
        badge: "04 · ASEO Y RESIDUOS",
        title: "Limpieza General",
        body: "<ul><li>Baños y cocina deben quedar impecables, tal como fueron entregados.</li><li>Toda la basura clasificada y amarrada en bolsas separadas en los contenedores.</li></ul>"
      },
      muros: {
        badge: "05 · INFRAESTRUCTURA",
        title: "Cuidado de Muros y Techos",
        body: "<ul><li>Globos <strong>EXCLUSIVAMENTE</strong> en las maderas habilitadas para esto.</li><li>Cero cinta doble contacto, clavos o pegamentos en muros, ventanas o techos.</li></ul>"
      },
      inflables: {
        badge: "06 · JUEGOS Y JARDÍN",
        title: "Juegos Inflables",
        body: "<ul><li>Sólo se permiten juegos inflables de <strong>tamaño mediano</strong>.</li><li><strong>PROHIBIDO</strong> instalarlos sobre el pasto o áreas verdes.</li></ul>"
      },
      aforo: {
        badge: "07 · CAPACIDAD",
        title: "Aforo y Estacionamientos",
        body: "<ul><li><strong>Aforo máximo permitido:</strong> 50 personas (sumando adultos y niños en total).</li><li><strong>Estacionamientos para visitas:</strong> 5 vehículos asignados al evento.</li></ul>"
      },
      mascotas: {
        badge: "08 · CONVIVENCIA",
        title: "Mascotas y Comunidad",
        body: "<ul><li>Mascotas <strong>bienvenidas sin restricción</strong>.</li><li>Sigamos las normas para que lo pasemos excelente y cuidemos este espacio que nos sirve a todos.</li></ul>"
      },
      ubicacion: {
        badge: "09 · UBICACIÓN Y ACCESO",
        title: "Condominio Los Olivos de Maipú",
        body: "<p style='margin-bottom:12px;'>Abre el mapa directo para compartir con tus invitados por WhatsApp o Waze:</p><button type='button' class='btn-close btn-action-map' onclick='openMap()'>📍 ABRIR EN GOOGLE MAPS</button>"
      }
    };

    function showInfo(key) {
      const item = dataReglas[key];
      if (!item) return;
      document.getElementById('modalBadge').innerText = item.badge;
      document.getElementById('modalTitle').innerText = item.title;
      document.getElementById('modalBody').innerHTML = item.body;
      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal(e) {
      if (e.target.id === 'modalOverlay') forceClose();
    }

    function forceClose() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function openMap() {
      window.open('https://maps.google.com/?q=Condominio+Los+Olivos+Maipu', '_blank');
    }

    // VOZ NATURAL Y OPTIMIZADA
    let isSpeaking = false;
    let availableVoices = [];

    function cargarVoces() {
      if ('speechSynthesis' in window) {
        availableVoices = window.speechSynthesis.getVoices();
      }
    }
    cargarVoces();
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = cargarVoces;
    }

    function seleccionarVozNatural() {
      if (!availableVoices.length) cargarVoces();
      
      // Priorizar voces naturales o neuronales en español
      const vocesEspanol = availableVoices.filter(v => v.lang.startsWith('es'));
      const vozNatural = vocesEspanol.find(v => 
        v.name.includes('Natural') || 
        v.name.includes('Google') || 
        v.name.includes('Premium') ||
        v.name.includes('Paulina') || 
        v.name.includes('Sofia') ||
        v.name.includes('Mónica')
      );
      return vozNatural || vocesEspanol[0] || null;
    }

    const voiceMessage = "¡Hola vecina, hola vecino! Les damos la más cordial bienvenida al Club House del Condominio Los Olivos de Maipú. Deseamos que disfruten al máximo su celebración junto a su familia y amigos. Para que todo resulte perfecto, recuerden que los días de semana el evento termina a las 22 horas, y los viernes y sábados finaliza a la 1 de la madrugada. No se preocupen por la entrega inmediata de noche: tienen plazo hasta el día siguiente a las 10 de la mañana para ordenar con calma y hacer la devolución. Les pedimos entregar la cocina y los baños impecables, tal como los recibieron, con la basura ordenada en bolsas separadas y la parrilla completamente apagada. Recuerden que el aforo es de 50 personas contando adultos y niños, disponen de 5 estacionamientos para sus visitas y sus mascotas son siempre bienvenidas. Sigamos estas normas para pasarlo excelente y cuidar juntos este lugar que nos sirve a todos. ¡Que tengan una fiesta maravillosa!";

    function toggleVoiceAudio() {
      const btn = document.getElementById('btnAudio');
      const audioTrack = document.getElementById('audioTrack');

      if (audioTrack && audioTrack.src && !audioTrack.paused) {
        audioTrack.pause();
        audioTrack.currentTime = 0;
        btn.classList.remove('playing');
        return;
      }

      if (isSpeaking) {
        window.speechSynthesis.cancel();
        isSpeaking = false;
        btn.classList.remove('playing');
        return;
      }

      if (audioTrack && audioTrack.readyState >= 2) {
        audioTrack.play();
        btn.classList.add('playing');
        audioTrack.onended = () => btn.classList.remove('playing');
      } else if ('speechSynthesis' in window) {
        const utterance = new SpeechSynthesisUtterance(voiceMessage);
        const vozSeleccionada = seleccionarVozNatural();

        if (vozSeleccionada) {
          utterance.voice = vozSeleccionada;
        }

        utterance.lang = 'es-CL';
        utterance.rate = 0.92;  // Ritmo ligeramente más pausado para sonar natural
        utterance.pitch = 1.05; // Tono más cálido y conversacional

        utterance.onstart = () => {
          isSpeaking = true;
          btn.classList.add('playing');
        };

        utterance.onend = () => {
          isSpeaking = false;
          btn.classList.remove('playing');
        };

        utterance.onerror = () => {
          isSpeaking = false;
          btn.classList.remove('playing');
        };

        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
